<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آفلاین هستید | healthy-taste</title>
    <style>
        :root {
            --primary: #2c6e49;
            --accent: #f97316;
            --light: #f8f9fa;
            --text: #333;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Vazirmatn', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        
        .offline-container {
            background: rgba(255, 255, 255, 0.95);
            color: var(--text);
            padding: 40px;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--primary);
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
            color: #666;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 160px;
            justify-content: center;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }
        
        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            text-align: right;
        }
        
        .features h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--primary);
        }
        
        .features ul {
            list-style: none;
        }
        
        .features li {
            padding: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
        }
        
        .features i {
            color: var(--accent);
        }
        
        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .actions {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        
        <h1>اتصال اینترنت قطع است</h1>
        
        <p>
            شما در حال حاضر آفلاین هستید. این صفحه به صورت آفلاین در دسترس است.
            <br>
            می‌توانید محصولاتی که قبلاً مشاهده کرده‌اید را ببینید.
        </p>
        
        <div class="actions">
            <button class="btn-primary" onclick="window.location.reload()">
                <i class="fas fa-redo"></i>
                تلاش مجدد
            </button>
            
            <button class="btn-outline" onclick="window.history.back()">
                <i class="fas fa-arrow-right"></i>
                بازگشت
            </button>
        </div>
        
        <div class="features">
            <h3>امکانات آفلاین:</h3>
            <ul>
                <li><i class="fas fa-check"></i> مشاهده محصولات ذخیره شده</li>
                <li><i class="fas fa-check"></i> مشاهده سبد خرید</li>
                <li><i class="fas fa-check"></i> مشاهده علاقه‌مندی‌ها</li>
                <li><i class="fas fa-check"></i> تماس با پشتیبانی (به محض اتصال)</li>
            </ul>
        </div>
    </div>
    
    <script>
        // Check network status periodically
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
        
        // Listen for network status changes
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
